<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece7d6" />
    <meta
      name="description"
      content="Orbitune turns any song into a planet you can explore. Search for a song or upload one to begin."
    />
    <title>Orbitune</title>
    <!-- The styles are linked here, not imported from JavaScript, so the
         browser has them before it draws anything. Importing them from
         main.js made the page flash unstyled on every refresh. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="sheet__title">
        <h1>Orbitune</h1>
        <p>Every song is a world. Go explore it.</p>
      </header>

      <!-- main.js puts the song picker in here. -->
      <main id="app" class="sheet__picker"></main>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
