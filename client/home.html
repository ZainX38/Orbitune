<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06070b" />
    <meta
      name="description"
      content="Orbitune turns any song into a planet you can explore. Search for a song or upload one to begin."

    <title>Orbitune | Song picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="home">
    <div class="sheet">
      <header class="sheet__title">
        <h1>Orbi<em>tune</em></h1>
        <p>Pick a song, or bring your own. Orbitune measures its tempo, energy and sections, then charts a planet you can land on.</p>

      <main id="app" class="sheet__picker plate-ticks"></main>

    <script type="module" src="/src/main.js"></script>
