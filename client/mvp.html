<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04050a" />
    <title>Orbitune MVP</title>
    <!-- Only for the colour variables (the space scheme). The start page's own
         layout is scoped to body.home, so none of it applies here. -->
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space-bg); }
      body { font: 400 14px/1.4 var(--font-text); color: var(--text); -webkit-font-smoothing: antialiased; accent-color: var(--accent); }
      canvas { display: block; }
      .panel { position: fixed; user-select: none; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }

      /* Every HUD control is a quiet, square-cornered panel button with a small uppercase label. */
      #back, #songs button, #audio-controls button {
        font: 600 12px/1 var(--font-label); letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--text); cursor: pointer;
        min-height: 36px; padding: 0 14px; border-radius: var(--radius-sm);
        border: 1px solid var(--panel-border-strong); background: var(--panel);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      }
      #back:hover, #songs button:hover, #audio-controls button:hover {
        border-color: rgb(255 255 255 / 0.4); background: var(--panel-strong);
      }

      #back { left: 28px; top: 24px; display: inline-flex; align-items: center; gap: 8px; padding-left: 10px; }
      #back[hidden] { display: none; }
      #back svg { width: 16px; height: 16px; flex: none; }

      #info { left: 28px; top: 80px; pointer-events: none; }
      #planet-name { font-size: 32px; font-weight: 300; letter-spacing: -0.01em; line-height: 1.1; color: var(--text); }
      #song-name { margin-top: 8px; color: var(--muted); font-size: 14px; }
      #song-time {
        margin-top: 14px; color: var(--muted); font-size: 12px; font-weight: 600;
        letter-spacing: 0.08em; font-variant-numeric: tabular-nums;
      }
      #progress { margin-top: 8px; width: 220px; height: 2px; background: var(--panel-border-strong); overflow: hidden; }
      #progress > div { height: 100%; width: 0; background: var(--accent); }

      #songs { right: 28px; top: 24px; display: flex; gap: 6px; }
      /* The playing song: marked in blue, but not filled, so it stays quiet. */
      #songs button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); background: var(--panel-strong); }
      #songs button:disabled { opacity: 0.5; cursor: progress; }

      #hint {
        left: 50%; bottom: 30px; transform: translateX(-50%);
        padding: 9px 16px; border-radius: var(--radius-sm); white-space: nowrap;
        background: var(--panel); border: 1px solid var(--panel-border);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        color: var(--text); font-size: 13px;
        pointer-events: none; transition: opacity 0.3s;
      }
      #hint:empty { opacity: 0; }

      #audio-controls {
        right: 28px; bottom: 24px; display: flex; align-items: center; gap: 14px;
        padding: 6px 6px 6px 14px; border: 1px solid var(--panel-border); border-radius: var(--radius);
        background: var(--panel-strong); text-shadow: none; color: var(--muted);
        font: 600 11px/1 var(--font-label); letter-spacing: 0.1em; text-transform: uppercase;
      }
      #audio-controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      #audio-controls label:hover { color: var(--text); }
      #audio-controls button { min-height: 30px; padding: 0 12px; font-size: 11px; backdrop-filter: none; }
      #audio-controls button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
      #narration-enabled { margin: 0; }
      #music-volume { width: 90px; margin: 0; }

      #landmark-label {
        left: 50%; top: 40%; opacity: 0; transform: translate(-50%, -50%);
        padding: 7px 12px; border: 1px solid var(--panel-border-strong); border-radius: var(--radius-sm);
        background: var(--panel-strong); font-size: 13px; font-weight: 600;
        transition: opacity .2s ease; pointer-events: none;
      }
      #captions {
        left: 50%; bottom: 82px; transform: translateX(-50%); max-width: min(680px, calc(100vw - 40px));
        padding: 12px 18px; border: 1px solid var(--panel-border); border-radius: var(--radius);
        background: var(--panel-strong); text-align: center; font-size: 17px; line-height: 1.45;
      }
      #narration-toast {
        left: 50%; top: 24px; transform: translateX(-50%); padding: 8px 14px;
        border: 1px solid var(--panel-border-strong); border-radius: var(--radius-sm);
        background: var(--panel-strong); color: var(--text); font-size: 13px;
        opacity: 0; transition: opacity .2s ease; pointer-events: none;
      }
      #narration-toast[data-visible="true"] { opacity: 1; }

      /* The debug overlay (F3) sets its look inline from JS; these override only the colours. */
      #debug-overlay {
        color: var(--text) !important;
        background: var(--panel-strong) !important;
        border-color: var(--panel-border-strong) !important;
        border-radius: var(--radius-sm) !important;
      }

      /* 13-inch laptops and smaller windows: pull the HUD a little closer to the edges. */
      @media (max-width: 1100px) {
        #back { left: 20px; top: 18px; }
        #info { left: 20px; top: 72px; }
        #songs { right: 20px; top: 18px; }
        #audio-controls { right: 20px; bottom: 18px; }
      }

      @media (max-width: 640px) {
        #songs { top: auto; bottom: 84px; right: 50%; transform: translateX(50%); }
        #hint { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 48px); }
        #planet-name { font-size: 26px; }
        #audio-controls { right: 12px; bottom: 12px; gap: 10px; }
        #music-volume { width: 64px; }
        #captions { bottom: 75px; font-size: 15px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #songs button, #back, #hint, #audio-controls button, #landmark-label, #narration-toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <button id="back" class="panel" type="button" aria-label="Back to galaxy" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to galaxy
    </button>
    <div id="info" class="panel">
      <div id="planet-name"></div>
      <div id="song-name"></div>
      <div id="song-time"></div>
      <div id="progress"><div></div></div>
    </div>
    <div id="songs" class="panel"></div>
    <div id="hint" class="panel"></div>
    <div id="landmark-label" class="panel" aria-hidden="true"></div>
    <div id="captions" class="panel" aria-live="polite" hidden></div>
    <div id="narration-toast" class="panel" role="status" aria-live="polite"></div>
    <div id="audio-controls" class="panel">
      <label><input id="narration-enabled" type="checkbox" checked /> Narration</label>
      <label for="music-volume">Music <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.9" /></label>
      <button id="music-mute" type="button" aria-pressed="false">Mute</button>
    </div>
    <script type="module" src="/src/mvp/main.js"></script>
  </body>
</html>
