<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05060f" />
    <title>Orbitune MVP</title>
    <!-- Only for the colour variables (the space scheme). The start page's own
         layout is scoped to body.home, so none of it applies here. -->
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space-bg); }
      body { font: 500 15px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--text); }
      canvas { display: block; }
      .panel { position: fixed; user-select: none; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55); }

      #back {
        left: 28px; top: 24px; display: inline-flex; align-items: center; gap: 8px;
        font: inherit; color: inherit; cursor: pointer;
        padding: 9px 16px 9px 12px; border-radius: 999px;
        border: 1px solid var(--panel-border-strong); background: var(--panel);
        backdrop-filter: blur(6px); transition: background 0.2s, border-color 0.2s, color 0.2s;
      }
      #back[hidden] { display: none; }
      #back svg { width: 16px; height: 16px; flex: none; }
      #back:hover { border-color: var(--accent); background: var(--panel-hover); }
      #back:focus-visible { border-color: var(--accent); outline: 2px solid var(--focus); outline-offset: 2px; }

      #info { left: 28px; top: 80px; pointer-events: none; }
      #planet-name { font-size: 30px; font-weight: 650; letter-spacing: 0.01em; line-height: 1.1; color: var(--text); }
      #song-name { margin-top: 6px; color: var(--muted); }
      #song-time { margin-top: 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
      #progress { margin-top: 6px; width: 220px; height: 3px; border-radius: 2px; background: var(--panel-border); overflow: hidden; }
      #progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

      #songs { right: 28px; top: 24px; display: flex; gap: 8px; }
      #songs button {
        font: inherit; color: inherit; cursor: pointer;
        padding: 9px 16px; border-radius: 999px;
        border: 1px solid var(--panel-border-strong); background: var(--panel);
        backdrop-filter: blur(6px); transition: background 0.2s, border-color 0.2s, color 0.2s;
      }
      #songs button:hover { border-color: var(--accent); background: var(--panel-hover); }
      #songs button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      #songs button[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); text-shadow: none; }
      #songs button:disabled { opacity: 0.5; cursor: progress; }

      #hint {
        left: 50%; bottom: 30px; transform: translateX(-50%);
        padding: 10px 20px; border-radius: 999px; white-space: nowrap;
        background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(6px);
        pointer-events: none; transition: opacity 0.3s;
      }
      #hint:empty { opacity: 0; }

      /* The debug overlay (F3) sets its look inline from JS; these override only the colours. */
      #debug-overlay {
        color: var(--text) !important;
        background: var(--panel-strong) !important;
        border-color: var(--panel-border-strong) !important;
      }

      @media (max-width: 640px) {
        #songs { top: auto; bottom: 84px; right: 50%; transform: translateX(50%); }
        #hint { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 48px); border-radius: 18px; }
        #planet-name { font-size: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #songs button, #back, #hint { transition: none; }
      }
    </style>
  </head>
  <body>
    <button id="back" class="panel" type="button" aria-label="Back to galaxy" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to galaxy
    </button>
    <div id="info" class="panel">
      <div id="planet-name"></div>
      <div id="song-name"></div>
      <div id="song-time"></div>
      <div id="progress"><div></div></div>
    </div>
    <div id="songs" class="panel"></div>
    <div id="hint" class="panel"></div>
    <script type="module" src="/src/mvp/main.js"></script>
  </body>
</html>
